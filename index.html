    const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C)));
    document.open();document.write(h);document.close();
  }catch(e){document.getElementById("e").textContent="Incorrect password."}
};
